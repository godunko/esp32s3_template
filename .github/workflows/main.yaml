
name: Build and Run
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/godunko/espidf-alire:main
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build Xtensa Dynconfig
      run: |
        alr -C crates/xtensa-dynconfig --non-interactive with --solve
        alr -C crates/xtensa-dynconfig build
    - name: Build A0B Tools
      run: |
        alr -C crates/a0b-tools --non-interactive with --solve
        alr -C crates/a0b-tools build
    - name: Build application and run it
      shell: bash
      run: |
        set -eo pipefail
        . "$IDF_PATH/export.sh"
        idf.py set-target esp32s3
        idf.py build
        idf.py build
        rm .objs/app_main.o
        idf.py build
        idf.py clean
        idf.py build
        idf.py qemu --qemu-extra-args --no-reboot 2>&1 | tee qemu.log
        grep -F "Hello, Ada world!" qemu.log
        grep -F "Restarting..." qemu.log
